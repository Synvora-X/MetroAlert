
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: metroalert-backend-dev
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: metroalert-frontend-dev
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    restart: unless-stopped

volumes:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
